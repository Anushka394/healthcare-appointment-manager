# ============================================================
# Application
# ============================================================
spring.application.name=healthcare-appointment-manager
server.port=8080

# ============================================================
# Database - MySQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:anushka}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Email - JavaMailSender (configure with SendGrid SMTP or Gmail)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:no-reply@healthcare.com}
app.mail.retry.max-attempts=${MAIL_RETRY_MAX:3}

# ============================================================
# LLM - OpenAI (or compatible endpoint)
# ============================================================
app.llm.api-key=${OPENAI_API_KEY:your-openai-api-key}
app.llm.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
app.llm.model=${OPENAI_MODEL:gpt-3.5-turbo}
app.llm.timeout-seconds=${LLM_TIMEOUT:30}

# ============================================================
# Google Calendar OAuth2
# ============================================================
app.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth2/callback}
app.google.tokens-dir=${GOOGLE_TOKENS_DIR:tokens}

# ============================================================
# Quartz Scheduler - use in-memory store to avoid QRTZ table setup
# ============================================================
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ============================================================
# Medication Reminder - cron (every day at 8am and 8pm)
# ============================================================
app.scheduler.medication-reminder-cron=${MED_REMINDER_CRON:0 0 8,20 * * ?}
app.scheduler.appointment-reminder-cron=${APPT_REMINDER_CRON:0 0 9 * * ?}
app.scheduler.slot-hold-cleanup-cron=${SLOT_HOLD_CRON:0 */5 * * * ?}
app.scheduler.slot-hold-expiry-minutes=${SLOT_HOLD_EXPIRY:10}

# ============================================================
# Logging
# ============================================================
logging.level.com.healthcare=INFO
logging.level.org.springframework.security=WARN

# Notification retry interval (15 min in ms)
app.scheduler.notification-retry-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:900000}

# Doctor leave conflict check interval (30 min in ms)
app.scheduler.leave-conflict-check-delay-ms=${LEAVE_CONFLICT_CHECK_DELAY_MS:1800000}
